<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 PosterVote — Votez !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1520;--surface:#16202e;--surface2:#1c2a3a;--surface3:#223040;
  --border:#2a3f55;--border2:#344f6a;
  --teal:#2dd4bf;--lavender:#a78bfa;--rose:#fb7185;--amber:#fbbf24;
  --gold:#f59e0b;--silver:#94a3b8;--bronze:#cd7c2c;
  --text:#e8f0fe;--text2:#94a3b8;--text3:#64748b;
  --green:#34d399;--danger:#fb7185;
  --fd:'Playfair Display',Georgia,serif;--fb:'Inter',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;overflow-x:hidden;line-height:1.6}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 10% 0%,rgba(45,212,191,.07) 0%,transparent 60%),
             radial-gradient(ellipse 50% 50% at 90% 100%,rgba(167,139,250,.06) 0%,transparent 60%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(45,212,191,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(45,212,191,.03) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%)}
nav{position:sticky;top:0;z-index:100;background:rgba(15,21,32,.9);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(45,212,191,.1);display:flex;align-items:center;
  justify-content:space-between;padding:0 2rem;height:60px}
.logo{font-family:var(--fd);font-size:1.4rem;font-weight:700;
  background:linear-gradient(135deg,var(--teal),var(--lavender));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status-pill{font-size:.72rem;padding:.3rem .9rem;border-radius:20px;font-weight:600;
  display:flex;align-items:center;gap:.4rem;letter-spacing:.04em}
.status-pill::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-pill.open{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.status-pill.open::before{background:var(--green)}
.status-pill.closed{background:rgba(251,113,133,.12);color:var(--rose);border:1px solid rgba(251,113,133,.25)}
.status-pill.closed::before{background:var(--rose);animation:none}
.countdown-nav{font-size:.78rem;color:var(--amber);font-weight:600;font-family:var(--fd)}
main{padding:2rem;position:relative;z-index:1;max-width:1200px;margin:0 auto}
.hero{text-align:center;padding:2.5rem 1rem 2rem;margin-bottom:1.5rem}
.hero-title{font-family:var(--fd);font-size:clamp(2rem,5vw,3.5rem);font-weight:900;line-height:1.1;
  background:linear-gradient(135deg,#e8f0fe 0%,var(--lavender) 50%,var(--teal) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.hero-sub{color:var(--text2);font-size:1rem;max-width:420px;margin:0 auto}
.voted-badge{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;
  background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--green);
  padding:.4rem 1.1rem;border-radius:20px;font-size:.82rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;margin-bottom:2rem}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.poster-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);
  border-radius:18px;overflow:hidden;cursor:pointer;transition:all .28s;position:relative}
.poster-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.poster-card.voted-for{border-color:var(--teal);box-shadow:0 0 0 2px rgba(45,212,191,.3)}
.poster-card.disabled{cursor:default;opacity:.75}
.poster-card.disabled:hover{transform:none}
.p-img-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--surface3);position:relative}
.p-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.poster-card:hover .p-img-wrap img{transform:scale(1.04)}
.p-zoom{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.55);border:none;color:#fff;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;z-index:10;opacity:0;transition:opacity .2s;line-height:1}
.p-img-wrap:hover .p-zoom{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .15s;padding:1rem}
.lightbox img{max-width:95vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,.6);cursor:default}
.lightbox-close{position:fixed;top:1rem;right:1rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lightbox-close:hover{background:rgba(255,255,255,.25)}
.p-ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:3rem;color:var(--text3)}
.p-body{padding:1rem}
.p-name{font-family:var(--fd);font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.p-bar-wrap{height:5px;background:rgba(255,255,255,.06);border-radius:3px;margin-bottom:.5rem;overflow:hidden}
.p-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--lavender));transition:width .6s ease}
.p-meta{display:flex;justify-content:space-between;align-items:center}
.p-votes-count{font-size:.8rem;color:var(--text3);font-weight:500}
.vote-btn{padding:.45rem 1rem;border-radius:8px;border:none;font-family:var(--fb);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .22s}
.vote-btn.active{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#0f1520;box-shadow:0 3px 12px rgba(45,212,191,.3)}
.vote-btn.active:hover{transform:translateY(-1px)}
.vote-btn.my-vote{background:rgba(45,212,191,.15);color:var(--teal);border:1px solid rgba(45,212,191,.3)}
.vote-btn.disabled{background:rgba(255,255,255,.05);color:var(--text3);cursor:default}
.voted-check{position:absolute;top:.75rem;right:.75rem;background:var(--teal);color:#0f1520;
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.podium-section{margin-bottom:2.5rem}
.section-title{font-family:var(--fd);font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:1.75rem;
  background:linear-gradient(135deg,var(--gold),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:.75rem;animation:riseUp .7s ease both}
@keyframes riseUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.podium-item:nth-child(1){animation-delay:.1s}.podium-item:nth-child(2){animation-delay:0s}.podium-item:nth-child(3){animation-delay:.2s}
.podium-img{border-radius:12px;object-fit:cover;border:3px solid transparent}
.podium-item.rank-1 .podium-img{width:160px;height:160px;border-color:var(--gold);box-shadow:0 0 30px rgba(245,158,11,.4)}
.podium-item.rank-2 .podium-img{width:130px;height:130px;border-color:var(--silver)}
.podium-item.rank-3 .podium-img{width:110px;height:110px;border-color:var(--bronze)}
.podium-name{font-family:var(--fd);font-weight:700;text-align:center;font-size:.95rem}
.podium-medal{font-size:1.8rem}
.podium-score{font-size:.8rem;color:var(--text2)}
.podium-block{border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:1.5rem;font-weight:700;color:rgba(255,255,255,.9);width:100px}
.podium-item.rank-1 .podium-block{height:100px;background:linear-gradient(180deg,rgba(245,158,11,.3),rgba(245,158,11,.15));border:1px solid rgba(245,158,11,.3)}
.podium-item.rank-2 .podium-block{height:70px;background:linear-gradient(180deg,rgba(148,163,184,.2),rgba(148,163,184,.1));border:1px solid rgba(148,163,184,.2)}
.podium-item.rank-3 .podium-block{height:50px;background:linear-gradient(180deg,rgba(205,124,44,.2),rgba(205,124,44,.1));border:1px solid rgba(205,124,44,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;
  padding:2rem;max-width:400px;width:100%;text-align:center;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal img{width:120px;height:120px;object-fit:cover;border-radius:12px;margin-bottom:1rem;border:2px solid var(--teal)}
.modal h3{font-family:var(--fd);font-size:1.4rem;margin-bottom:.5rem}
.modal p{color:var(--text2);font-size:.9rem;margin-bottom:1.5rem}
.modal-btns{display:flex;gap:.75rem;justify-content:center}
.btn{padding:.65rem 1.3rem;border-radius:10px;border:none;font-family:var(--fb);font-weight:600;font-size:.875rem;cursor:pointer;transition:all .22s}
.btn-teal{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#0f1520;box-shadow:0 4px 14px rgba(45,212,191,.25)}
.btn-teal:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.closed-banner{text-align:center;padding:3rem 1rem;color:var(--text2)}
.closed-banner .icon{font-size:3rem;margin-bottom:1rem;display:block}
.closed-banner h2{font-family:var(--fd);font-size:1.8rem;margin-bottom:.5rem;color:var(--text)}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  padding:.75rem 1.6rem;border-radius:12px;font-size:.875rem;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:999;transition:opacity .3s;max-width:90vw;text-align:center}
.toast.ok{border-color:rgba(52,211,153,.4);color:var(--green)}
.toast.err{border-color:rgba(251,113,133,.4);color:var(--danger)}
.toast.hidden{opacity:0;pointer-events:none}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:300}
</style>
</head>
<body>
<nav>
  <div class="logo">🏆 PosterVote</div>
  <div style="display:flex;align-items:center;gap:.75rem">
    <span id="countdown-nav" class="countdown-nav" style="display:none"></span>
    <span id="badge" class="status-pill closed">…</span>
  </div>
</nav>
<main id="main"><p style="text-align:center;padding:4rem;color:var(--text2)">Chargement…</p></main>
<div class="toast hidden" id="toast"></div>
<div class="confetti-wrap" id="confetti"></div>

<script>
const FB='https://postervote-default-rtdb.europe-west1.firebasedatabase.app';
const CACHE_KEY='pv_state_cache';
let state=null,pendingVote=null;

function saveCache(s){try{localStorage.setItem(CACHE_KEY,JSON.stringify(s))}catch(e){}}
function loadCache(){try{const c=localStorage.getItem(CACHE_KEY);return c?JSON.parse(c):null}catch(e){return null}}

async function fbGet(){try{const r=await fetch(`${FB}/state.json`);return r.ok?await r.json():null}catch(e){return null}}
async function fbPatch(path,data){try{const r=await fetch(`${FB}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok}catch(e){return false}}

function applyPatch(obj,path,data){
  // path="/posters/0" ou "/" ou "/voteOpen" etc.
  const parts=path.replace(/^\//,'').split('/').filter(Boolean);
  if(!parts.length){Object.assign(obj,data);return;}
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){
    if(cur[parts[i]]===undefined)cur[parts[i]]={};
    cur=cur[parts[i]];
  }
  const last=parts[parts.length-1];
  if(data!==null&&typeof data==='object'&&!Array.isArray(data)&&cur[last]&&typeof cur[last]==='object'){
    Object.assign(cur[last],data);
  }else{
    cur[last]=data;
  }
}

function startSSE(){
  const es=new EventSource(`${FB}/state.json`);
  es.addEventListener('put',e=>{try{const d=JSON.parse(e.data);if(d.data!==undefined){state=d.data;saveCache(state);render();}}catch(err){}});
  es.addEventListener('patch',e=>{try{const d=JSON.parse(e.data);if(d.data!==null&&state){applyPatch(state,d.path||'/',d.data);saveCache(state);render();}}catch(err){}});
  es.onerror=()=>{es.close();setTimeout(startSSE,3000)};
}

function isOpen(s){if(!s||!s.voteOpen)return false;if(s.deadline&&Date.now()>=new Date(s.deadline).getTime())return false;return true}
function votesKey(){return'pv_votes_'+(state&&state.sessionId?state.sessionId:'default')}
function myVotes(){try{const v=localStorage.getItem(votesKey());return v?JSON.parse(v):[]}catch(e){return[]}}
function hasVotedFor(id){return myVotes().includes(id)}
function canVote(){return myVotes().length<3}
function addVote(id){const v=myVotes();if(!v.includes(id)&&v.length<3){v.push(id);localStorage.setItem(votesKey(),JSON.stringify(v));return true;}return false;}
function fmt(ms){if(ms<=0)return'Terminé';const sec=Math.floor(ms/1000),m=Math.floor(sec/60),h=Math.floor(m/60),d=Math.floor(h/24);if(d>0)return`${d}j ${h%24}h`;if(h>0)return`${h}h ${m%60}m`;return`${m}m ${sec%60}s`}
function maxV(p){return Math.max(1,...(p||[]).map(x=>x.votes||0))}

function render(){
  if(!state)return;
  const open=isOpen(state);
  const b=document.getElementById('badge');
  if(b){b.textContent=open?'Ouvert':'Fermé';b.className='status-pill '+(open?'open':'closed');}
  clearInterval(window._cdTick);
  const cn=document.getElementById('countdown-nav');
  if(state.deadline&&open){
    cn.style.display='';
    window._cdTick=setInterval(()=>{const ms=new Date(state.deadline).getTime()-Date.now();cn.textContent=fmt(ms);if(ms<=0){clearInterval(window._cdTick);cn.style.display='none';}},1000);
  }else{cn.style.display='none';}
  if(state.podiumShown){renderPodium();return}
  if(!open){renderClosed();return}
  renderVote();
}

function renderVote(){
  const votes=myVotes(),voteCount=votes.length,allVoted=voteCount>=3,mx=maxV(state.posters);
  const heroMsg=allVoted?'Vos 3 votes ont bien été enregistrés.':voteCount>0?`Vous avez voté pour ${voteCount}/3 poster${voteCount>1?'s':''}. Encore ${3-voteCount} vote${3-voteCount>1?'s':''} à donner.`:'Cliquez sur un poster pour voter. Vous pouvez choisir 3 posters.';
  document.getElementById('main').innerHTML=`
    <div class="hero">
      <h1 class="hero-title">Votez pour vos posters préférés</h1>
      <p class="hero-sub">${heroMsg}</p>
      ${voteCount>0?`<div class="voted-badge">✓ ${voteCount}/3 vote${voteCount>1?'s':''} enregistré${voteCount>1?'s':''}</div>`:''}
    </div>
    <div class="grid" id="grid"></div>`;
  const grid=document.getElementById('grid');
  (state.posters||[]).forEach((p,index)=>{
    const isMyVote=hasVotedFor(p.id);
    const canVoteForThis=!isMyVote&&!allVoted;
    const label=`Poster ${index+1}`;
    const div=document.createElement('div');
    div.className='poster-card'+(isMyVote?' voted-for':'')+(canVoteForThis?'':' disabled');
    if(canVoteForThis)div.onclick=()=>askVote(p.id);
    div.innerHTML=`
      ${p.dataUrl?`<div class="p-img-wrap"><img src="${p.dataUrl}" alt="${label}" loading="lazy"><button class="p-zoom" onclick="event.stopPropagation();openLightbox('${p.dataUrl}')" title="Voir en grand">⤢</button></div>`:`<div class="p-img-wrap"><div class="p-ph">🖼️</div></div>`}
      ${isMyVote?'<div class="voted-check">✓</div>':''}
      <div class="p-body">
        <div class="p-name">${label}</div>
        <div class="p-bar-wrap"><div class="p-bar" style="width:${mx?Math.round((p.votes||0)/mx*100):0}%"></div></div>
        <div class="p-meta">
          <span class="p-votes-count">${p.votes||0} vote${(p.votes||0)!==1?'s':''}</span>
          ${canVoteForThis?`<button class="vote-btn active" onclick="event.stopPropagation();askVote('${p.id}')">Voter</button>`:isMyVote?`<span class="vote-btn my-vote">Mon choix ✓</span>`:`<span class="vote-btn disabled">Voter</span>`}
        </div>
      </div>`;
    grid.appendChild(div);
  });
}

function renderClosed(){
  document.getElementById('main').innerHTML=`<div class="closed-banner"><span class="icon">🔒</span><h2>Le vote est fermé</h2><p>Merci de votre participation.</p></div>`;
}

function renderPodium(){
  const sorted=[...(state.posters||[])].sort((a,b)=>(b.votes||0)-(a.votes||0));
  const top=sorted.slice(0,3);
  const order=top.length>=2?[top[1],top[0],top[2]].filter(Boolean):top;
  const medals=['🥈','🥇','🥉'],rankClass=['rank-2','rank-1','rank-3'];
  document.getElementById('main').innerHTML=`
    <div class="podium-section">
      <div class="section-title">🏆 Résultats</div>
      <div class="podium">
        ${order.map((p,i)=>`<div class="podium-item ${rankClass[i]}">
          <div class="podium-medal">${medals[i]}</div>
          ${p.dataUrl?`<img class="podium-img" src="${p.dataUrl}" alt="${p.name}">`:`<div class="podium-img" style="background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:2rem">🖼️</div>`}
          <div class="podium-name">${p.name}</div>
          <div class="podium-score">${p.votes||0} vote${(p.votes||0)!==1?'s':''}</div>
          <div class="podium-block">${i===1?'1':i===0?'2':'3'}</div>
        </div>`).join('')}
      </div>
    </div>
    ${sorted.length>3?`<div class="grid">${sorted.slice(3).map((p,i)=>`<div class="poster-card disabled" style="opacity:.6">${p.dataUrl?`<div class="p-img-wrap"><img src="${p.dataUrl}" alt="${p.name}" loading="lazy"></div>`:`<div class="p-img-wrap"><div class="p-ph">🖼️</div></div>`}<div class="p-body"><div class="p-name">${i+4}. ${p.name}</div><div class="p-meta"><span class="p-votes-count">${p.votes||0} vote${(p.votes||0)!==1?'s':''}</span></div></div></div>`).join('')}</div>`:''}`;
  boom();
}

function askVote(id){
  if(!canVote()){toast('Vous avez déjà utilisé vos 3 votes.','err');return}
  if(hasVotedFor(id)){toast('Vous avez déjà voté pour ce poster.','err');return}
  const p=state.posters.find(x=>x.id===id);if(!p)return;
  const idx=(state.posters||[]).findIndex(x=>x.id===id);
  const label=`Poster ${idx+1}`;
  const voteNum=myVotes().length+1;
  pendingVote=id;
  const m=document.createElement('div');m.className='modal-bg';m.id='modal';
  m.innerHTML=`<div class="modal">
    ${p.dataUrl?`<img src="${p.dataUrl}" alt="${label}">`:'<div style="font-size:3rem;margin-bottom:1rem">🖼️</div>'}
    <h3>${label}</h3>
    <p>Confirmer votre vote pour ce poster ?<br><small style="color:var(--text3)">Vote ${voteNum} sur 3 — irréversible.</small></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-teal" onclick="confirmVote()">Confirmer ✓</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

function closeModal(){const m=document.getElementById('modal');if(m)m.remove();pendingVote=null;}

async function confirmVote(){
  const id=pendingVote;closeModal();if(!id)return;
  const fresh=await fbGet();
  if(!fresh){toast('Erreur réseau, réessayez.','err');return;}
  const idx=(fresh.posters||[]).findIndex(p=>p.id===id);if(idx<0)return;
  const newVotes=(fresh.posters[idx].votes||0)+1;
  const ok=await fbPatch(`state/posters/${idx}`,{votes:newVotes});
  if(ok){
    addVote(id);
    fresh.posters[idx].votes=newVotes;
    state=fresh;saveCache(state);
    const remaining=3-myVotes().length;
    toast(remaining>0?`🗳️ Vote enregistré ! Encore ${remaining} vote${remaining>1?'s':''} disponible${remaining>1?'s':''}.`:'🗳️ Vos 3 votes sont enregistrés !','ok');
    render();
  }else toast('Erreur réseau, réessayez.','err');
}

async function init(){
  // affiche le cache immédiatement
  const cached=loadCache();
  if(cached){state=cached;render();}
  // puis met à jour depuis Firebase
  const fresh=await fbGet();
  if(fresh){state=fresh;saveCache(state);render();}
  startSSE();
}
init();

function openLightbox(src){
  const lb=document.createElement('div');lb.className='lightbox';lb.id='lightbox';
  lb.onclick=e=>{if(e.target===lb)closeLightbox()};
  lb.innerHTML=`<button class="lightbox-close" onclick="closeLightbox()">✕</button><img src="${src}" alt="">`;
  document.body.appendChild(lb);
  document.addEventListener('keydown',_lbKey);
}
function closeLightbox(){const lb=document.getElementById('lightbox');if(lb)lb.remove();document.removeEventListener('keydown',_lbKey);}
function _lbKey(e){if(e.key==='Escape')closeLightbox();}

let _tt;
function toast(msg,cls=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(cls||'');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.add('hidden'),3200)}

function boom(){
  const w=document.getElementById('confetti');if(w.children.length>5)return;
  w.innerHTML='';const colors=['#2dd4bf','#a78bfa','#fb7185','#fbbf24','#e8f0fe','#34d399'];
  const st=document.createElement('style');st.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}';w.appendChild(st);
  for(let i=0;i<100;i++){const c=document.createElement('div'),sz=Math.random()*9+4;
    c.style.cssText=`position:absolute;top:-20px;left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation:fall ${Math.random()*2+2}s ${Math.random()*1.5}s ease-in forwards;opacity:.9`;
    w.appendChild(c)}
  setTimeout(()=>w.innerHTML='',5000);
}
</script>
